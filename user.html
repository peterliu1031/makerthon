<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用戶端 - 環保容器循環系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes scanline {
      0% { top: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }
    .animate-scan {
      animation: scanline 2s linear infinite;
    }
    /* 隱藏卷軸但保持可滑動 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 relative pb-20">
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,_rgba(16,185,129,0.15),_transparent_45%)] pointer-events-none"></div>

  <main class="relative mx-auto flex flex-col lg:flex-row min-h-[90vh] w-full max-w-5xl gap-8 px-4 py-8 items-start justify-center">
    
    <div class="w-full max-w-md flex flex-col mx-auto lg:mx-0">
      
      <section class="w-full rounded-3xl border border-slate-700 bg-slate-900/80 p-6 shadow-2xl backdrop-blur relative overflow-hidden">
        <div class="flex justify-between items-start relative z-10">
          <div>
            <h1 class="text-xl font-bold">我的環保帳戶 <span class="text-xs text-slate-400 ml-2">USER_5487</span></h1>
            <button onclick="toggleShop()" class="mt-2 text-xs bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/30 hover:bg-emerald-500/40 transition">
              🎁 進入獎勵商店兌換
            </button>
          </div>
        </div>
        
        <div class="mt-6 grid grid-cols-2 gap-4 relative z-10">
          <div class="rounded-2xl bg-slate-800/50 p-4 border border-slate-800">
            <p class="text-xs text-slate-400">錢包餘額</p>
            <p id="balanceText" class="mt-2 text-2xl font-black text-white">-- 元</p>
          </div>
          <div class="rounded-2xl bg-slate-800/50 p-4 border border-slate-800">
            <p class="text-xs text-slate-400">環保點數</p>
            <p id="pointsText" class="mt-2 text-2xl font-black text-emerald-400">-- 點</p>
          </div>
          <div class="rounded-2xl bg-slate-800/50 p-4 border border-slate-800">
            <p class="text-xs text-slate-400">信用評分</p>
            <p id="creditText" class="mt-2 text-2xl font-black text-blue-400">-- 分</p>
          </div>
          <div class="rounded-2xl bg-slate-800/50 p-4 border border-slate-800">
            <p class="text-xs text-slate-400">累計減碳量</p>
            <p id="carbonText" class="mt-2 text-2xl font-black text-cyan-400">-- kg</p>
          </div>
        </div>
      </section>

      <section class="mt-8 w-full text-center">
        <div id="cameraMockup" class="hidden mb-4 w-full h-48 bg-slate-900 border-2 border-dashed border-slate-600 rounded-2xl relative overflow-hidden flex flex-col items-center justify-center">
          <div class="absolute w-full h-1 bg-emerald-400 shadow-[0_0_10px_#34d399] animate-scan"></div>
          <p class="text-slate-400 text-sm animate-pulse">正在掃描商家 QR Code...</p>
        </div>

        <button id="rentBtn" class="w-full rounded-2xl bg-emerald-500 py-5 text-lg font-black text-slate-950 transition-all hover:bg-emerald-400 disabled:bg-slate-800 disabled:text-slate-600">
          <span id="rentBtnText">掃碼租借</span>
        </button>
        <p id="statusHint" class="mt-4 text-sm text-slate-400">等待商家生成 QR Code...</p>
        
        <div class="mt-4 flex gap-3">
          <button id="returnBtn" class="flex-1 rounded-2xl border border-slate-700 py-3 text-sm font-bold text-slate-400 hover:bg-slate-800">
            模擬歸還
          </button>
          <button id="overdueBtn" class="flex-1 rounded-2xl border border-red-500/50 py-3 text-sm font-bold text-red-400 hover:bg-red-500/20 transition">
            模擬逾期 (-20分)
          </button>
        </div>
      </section>

      <section class="mt-10 w-full">
        <h2 class="text-lg font-bold mb-4 border-l-4 border-emerald-500 pl-3">交易紀錄與詳情</h2>
        <div id="transactionList" class="space-y-4"></div>
      </section>

    </div>

    <aside class="w-full max-w-md mx-auto lg:mx-0 lg:w-96 flex-shrink-0 lg:sticky lg:top-8">
      <section class="w-full rounded-3xl border border-slate-700 bg-slate-900/80 p-6 shadow-2xl backdrop-blur max-h-[85vh] overflow-y-auto no-scrollbar">
        <div class="flex items-center gap-2 mb-6">
          <span class="text-xl">📍</span>
          <h2 class="text-sm font-bold text-slate-300 uppercase tracking-widest">附近合作商家</h2>
        </div>
        <div id="merchantList" class="space-y-4">
          </div>
      </section>
    </aside>

  </main>

  <div id="shopModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-3xl w-full max-w-sm p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
        <h2 class="text-xl font-bold text-emerald-400">🎁 獎勵兌換商店</h2>
        <button onclick="toggleShop()" class="text-slate-400 hover:text-white text-2xl">&times;</button>
      </div>
      
      <div class="space-y-4">
        <div class="bg-slate-800/50 p-4 rounded-2xl border border-slate-700 flex justify-between items-center">
          <div>
            <h3 class="font-bold text-white">5 元現金折扣券</h3>
            <p class="text-xs text-slate-400 mt-1">適用於所有合作商家</p>
          </div>
          <button onclick="redeemReward(50, '5 元現金折扣券')" class="bg-cyan-500 text-slate-950 font-bold px-4 py-2 rounded-xl hover:bg-cyan-400 text-sm">
            50 點
          </button>
        </div>
        
        <div class="bg-slate-800/50 p-4 rounded-2xl border border-slate-700 flex justify-between items-center">
          <div>
            <h3 class="font-bold text-white">免費租借券 x1</h3>
            <p class="text-xs text-slate-400 mt-1">抵扣一次租借押金手續</p>
          </div>
          <button onclick="redeemReward(100, '免費租借券')" class="bg-cyan-500 text-slate-950 font-bold px-4 py-2 rounded-xl hover:bg-cyan-400 text-sm">
            100 點
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    let openDropdowns = new Set(); 

    function toggleShop() {
      document.getElementById('shopModal').classList.toggle('hidden');
    }

    async function redeemReward(cost, itemName) {
      try {
        const response = await fetch(`${API_BASE}/api/redeem`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cost, itemName })
        });
        const result = await response.json();
        
        if (result.success) {
          alert(`🎉 ${result.message}`);
          fetchStatus(); 
        } else {
          alert(`❌ ${result.message}`);
        }
      } catch (e) {
        alert("網路連線錯誤");
      }
    }

    window.toggleDetail = function(txId) {
      if (openDropdowns.has(txId)) openDropdowns.delete(txId);
      else openDropdowns.add(txId);
      const el = document.getElementById(`detail-${txId}`);
      if (el) el.classList.toggle("hidden");
    };

    function renderTransactions(transactions) {
      const list = document.getElementById("transactionList");
      if (transactions.length === 0) {
        list.innerHTML = '<p class="text-center text-slate-600 text-sm py-10">尚無交易紀錄</p>';
        return;
      }

      list.innerHTML = transactions.map(tx => {
        const isComp = tx.isCompleted;
        const statusColor = isComp ? "text-emerald-400 border-emerald-500/30 bg-emerald-500/10" : "text-orange-400 border-orange-500/30 bg-orange-500/10";
        const statusText = isComp ? "歸還完成" : "尚未歸還完成";
        const isHidden = openDropdowns.has(tx.id) ? "" : "hidden";

        return `
          <div class="rounded-2xl border border-slate-700 bg-slate-900/90 overflow-hidden shadow-lg">
            <button onclick="toggleDetail('${tx.id}')" class="w-full p-5 text-left flex justify-between items-start hover:bg-slate-800/50 transition">
              <div>
                <h3 class="font-bold text-base text-white">${tx.merchantName}</h3>
                <p class="text-[10px] text-slate-500 mt-1">${tx.date}</p>
                <div class="mt-3 flex gap-4">
                  <div>
                    <p class="text-[10px] text-slate-500 uppercase">交易金額</p>
                    <p class="text-sm font-bold text-emerald-400">$${tx.amount}</p>
                  </div>
                  <div>
                    <p class="text-[10px] text-slate-500 uppercase">應歸還日期</p>
                    <p class="text-sm font-bold text-slate-200">${tx.deadline}</p>
                  </div>
                </div>
              </div>
              <div class="flex flex-col items-end gap-2">
                <span class="px-2 py-1 rounded-md border text-[10px] font-bold ${statusColor}">${statusText}</span>
                <span class="text-slate-600 text-xs">詳情 ▼</span>
              </div>
            </button>

            <div id="detail-${tx.id}" class="${isHidden} bg-slate-950/50 border-t border-slate-800 p-5 space-y-4">
              ${tx.details.map(item => `
                <div class="flex items-center justify-between p-3 rounded-xl bg-slate-900 border border-slate-800">
                  <div class="space-y-1">
                    <div class="flex items-center gap-2">
                      <span class="text-xs font-bold text-white">${item.typeName}</span>
                      <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 font-mono">${item.id}</span>
                    </div>
                    <p class="text-[10px] text-slate-500">
                      ${item.isReturned ? `歸還日期: ${item.returnDate}` : `歸還期限: ${tx.deadline}`}
                    </p>
                  </div>
                  <span class="text-xs font-bold ${item.isReturned ? 'text-emerald-500' : 'text-orange-500'}">
                    ${item.isReturned ? '已歸還' : '使用中'}
                  </span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    async function fetchStatus() {
      try {
        const response = await fetch(`${API_BASE}/api/status`);
        const result = await response.json();
        if (result.success) {
          const d = result.data;
          document.getElementById("balanceText").textContent = `${d.balance} 元`;
          document.getElementById("pointsText").textContent = `${d.points} 點`;
          document.getElementById("creditText").textContent = `${d.userCreditScore} 分`;
          document.getElementById("carbonText").textContent = `${d.userCarbonSaved.toFixed(2)} kg`;
          
          // 渲染附近商家列表，加上精緻的卡片樣式
          const mList = document.getElementById("merchantList");
          if (d.nearbyMerchants) {
            mList.innerHTML = d.nearbyMerchants.sort((a,b) => b.contribution - a.contribution).map((m, index) => {
              // 貢獻度前兩名加上高光提示
              const highlight = index < 2 ? "border-emerald-500/40 bg-slate-800/80 shadow-[0_0_15px_rgba(16,185,129,0.1)]" : "border-slate-800 bg-slate-900/50";
              return `
                <div class="${highlight} p-4 rounded-2xl flex justify-between items-center hover:border-emerald-500/60 transition cursor-pointer">
                  <div>
                    <p class="font-bold text-sm text-white flex items-center gap-1">
                      ${m.name} ${index === 0 ? '<span class="text-xs">👑</span>' : ''}
                    </p>
                    <p class="text-[10px] text-slate-500 mt-1">距離：${m.distance} | 評分：★${m.rating}</p>
                  </div>
                  <div class="text-right">
                    <p class="text-[9px] text-emerald-400 font-bold uppercase tracking-tighter">環保貢獻度</p>
                    <p class="text-lg font-black text-emerald-400">${m.contribution}</p>
                  </div>
                </div>
              `;
            }).join('');
          }

          const rentBtn = document.getElementById("rentBtn");
          const statusHint = document.getElementById("statusHint");
          
          if (document.getElementById('cameraMockup').classList.contains('hidden')) {
            if (d.isPrepared) {
              rentBtn.disabled = false;
              rentBtn.classList.replace("bg-emerald-500", "bg-cyan-400");
              document.getElementById("rentBtnText").textContent = "掃描商家 QR Code";
              statusHint.textContent = "商家已準備好，請掃碼";
            } else {
              rentBtn.disabled = true;
              rentBtn.classList.replace("bg-cyan-400", "bg-emerald-500");
              document.getElementById("rentBtnText").textContent = "相機尚未開啟";
              statusHint.textContent = "等待商家生成 QR Code...";
            }
          }

          renderTransactions(d.transactions);
        }
      } catch (e) { console.error("同步失敗", e); }
    }

    document.getElementById("rentBtn").addEventListener("click", () => {
      const camera = document.getElementById('cameraMockup');
      const rentBtn = document.getElementById('rentBtn');
      
      camera.classList.remove('hidden');
      rentBtn.classList.add('hidden');
      
      setTimeout(async () => {
        const res = await fetch(`${API_BASE}/api/rent`, { method: "POST" });
        const data = await res.json();
        
        camera.classList.add('hidden');
        rentBtn.classList.remove('hidden');

        if (!data.success) {
          alert(data.message);
        } else {
          fetchStatus();
        }
      }, 1500);
    });

    document.getElementById("returnBtn").addEventListener("click", async () => {
      const res = await fetch(`${API_BASE}/api/return`, { method: "POST" });
      const data = await res.json();
      alert(data.message);
      fetchStatus();
    });

    document.getElementById("overdueBtn").addEventListener("click", async () => {
      try {
        const res = await fetch(`${API_BASE}/api/test-overdue`, { method: "POST" });
        const data = await res.json();
        alert(data.message);
        fetchStatus();
      } catch (e) {
        alert("連線錯誤");
      }
    });

    setInterval(fetchStatus, 1500);
  </script>
</body>
</html>
