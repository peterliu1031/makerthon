<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用戶端 - 環保容器循環系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <div class="relative min-h-screen px-4 py-8">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,_rgba(16,185,129,0.2),_transparent_45%)]"></div>

    <main class="relative mx-auto flex min-h-[90vh] w-full max-w-xl flex-col items-center">
      <section class="w-full rounded-2xl border border-slate-700 bg-slate-900/80 p-6 shadow-xl backdrop-blur">
        <h1 class="text-xl font-bold">我的帳戶</h1>
        <p class="mt-1 text-sm text-slate-400">環保容器循環系統 MVP</p>
        <div class="mt-5 grid grid-cols-2 gap-4">
          <div class="rounded-xl bg-slate-800/80 p-4">
            <p class="text-sm text-slate-400">餘額</p>
            <p id="balanceText" class="mt-2 text-2xl font-semibold text-cyan-300">載入中...</p>
          </div>
          <div class="rounded-xl bg-slate-800/80 p-4">
            <p class="text-sm text-slate-400">環保點數</p>
            <p id="pointsText" class="mt-2 text-2xl font-semibold text-emerald-300">載入中...</p>
          </div>
        </div>
      </section>

      <section class="mt-12 w-full text-center">
        <button
          id="rentBtn"
          class="w-full rounded-2xl bg-emerald-500 py-6 text-xl font-bold text-slate-950 transition-all hover:bg-emerald-400 disabled:cursor-not-allowed disabled:opacity-50"
        >
          等待商家生成
        </button>
        <p id="statusHint" class="mt-4 text-sm text-slate-400">請等待商家準備 QR Code</p>
      </section>

      <section id="returnSection" class="mt-8 hidden w-full">
        <button
          id="returnBtn"
          class="w-full rounded-2xl bg-orange-500 py-4 text-lg font-bold text-white shadow-lg hover:bg-orange-400"
        >
          模擬歸還 (軟體觸發)
        </button>
        <p class="mt-2 text-center text-xs text-slate-500">偵測到容器靠近...點擊確認歸還</p>
      </section>
    </main>
  </div>

  <div id="returnToast" class="pointer-events-none fixed inset-0 z-50 flex items-center justify-center opacity-0 transition-opacity duration-300">
    <div id="returnToastCard" class="mx-4 w-full max-w-md scale-95 rounded-2xl border border-emerald-300/40 bg-emerald-500/90 p-6 text-center text-slate-950 shadow-2xl transition-transform duration-300">
      <p class="text-2xl font-extrabold">歸還成功！</p>
      <p class="mt-2 text-base font-semibold">退回押金 50 元，獲得點數 10 點</p>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:3000";
    const rentBtn = document.getElementById("rentBtn");
    const balanceText = document.getElementById("balanceText");
    const pointsText = document.getElementById("pointsText");
    const statusHint = document.getElementById("statusHint");
    const returnSection = document.getElementById("returnSection");
    const returnBtn = document.getElementById("returnBtn");
    const returnToast = document.getElementById("returnToast");
    const returnToastCard = document.getElementById("returnToastCard");

    let previousStatus = null;

    // 更新介面 UI 狀態
    function updateUI(status, isPrepared) {
      if (status === "rented") {
        rentBtn.disabled = true;
        rentBtn.textContent = "借用中";
        statusHint.textContent = "目前容器借用中，等待歸還";
        returnSection.classList.remove("hidden");
      } else {
        returnSection.classList.add("hidden");
        if (isPrepared) {
          rentBtn.disabled = false;
          rentBtn.textContent = "點擊租借";
          statusHint.textContent = "商家已準備好，可領取環保容器";
          statusHint.classList.add("text-emerald-400");
        } else {
          rentBtn.disabled = true;
          rentBtn.textContent = "等待商家生成";
          statusHint.textContent = "請等待商家準備 QR Code";
          statusHint.classList.remove("text-emerald-400");
        }
      }
    }

    function showReturnSuccessEffect() {
      returnToast.classList.replace("opacity-0", "opacity-100");
      returnToastCard.classList.replace("scale-95", "scale-100");
      setTimeout(() => {
        returnToast.classList.replace("opacity-100", "opacity-0");
        returnToastCard.classList.replace("scale-100", "scale-95");
      }, 2400);
    }

    async function fetchStatus() {
      try {
        const response = await fetch(`${API_BASE}/api/status`);
        const result = await response.json();

        if (result.success) {
          const d = result.data; // 使用統一的變數名稱
          balanceText.textContent = `${d.balance} 元`;
          pointsText.textContent = `${d.points} 點`;
          
          updateUI(d.status, d.isPrepared);
          
          if (previousStatus === "rented" && d.status === "idle") {
            showReturnSuccessEffect();
          }
          previousStatus = d.status;
        }
      } catch (error) {
        console.error("狀態更新失敗:", error);
      }
    }

    rentBtn.addEventListener("click", async () => {
      try {
        const response = await fetch(`${API_BASE}/api/rent`, { method: "POST" });
        const res = await response.json();

        if (res.success) {
          alert("租借成功，已扣除押金 50 元");
          fetchStatus();
        } else {
          alert(res.message);
        }
      } catch (error) {
        alert("租借請求失敗，請檢查伺服器連線");
      }
    });

    returnBtn.addEventListener("click", async () => {
      try {
        const response = await fetch(`${API_BASE}/api/return`, { method: "POST" });
        const res = await response.json();
        if (res.success) fetchStatus();
      } catch (error) {
        alert("歸還請求失敗");
      }
    });

    fetchStatus();
    setInterval(fetchStatus, 1500);
  </script>
</body>
</html>
