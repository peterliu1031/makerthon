<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用戶端 - 環保容器循環系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <div class="relative min-h-screen px-4 py-8">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,_rgba(16,185,129,0.15),_transparent_45%)] pointer-events-none"></div>

    <main class="relative mx-auto flex min-h-[90vh] w-full max-w-md flex-col items-center">
      <section class="w-full rounded-3xl border border-slate-700 bg-slate-900/80 p-6 shadow-2xl backdrop-blur">
        <h1 class="text-xl font-bold">我的環保帳戶 <span class="text-xs text-slate-400 ml-2">USER_5487</span></h1>
        
        <div class="mt-6 grid grid-cols-2 gap-4">
          <div class="rounded-2xl bg-slate-800/50 p-4 border border-slate-800">
            <p class="text-xs text-slate-400">錢包餘額</p>
            <p id="balanceText" class="mt-2 text-2xl font-black text-white">-- 元</p>
          </div>
          <div class="rounded-2xl bg-slate-800/50 p-4 border border-slate-800">
            <p class="text-xs text-slate-400">環保點數</p>
            <p id="pointsText" class="mt-2 text-2xl font-black text-emerald-400">-- 點</p>
          </div>
          <div class="rounded-2xl bg-slate-800/50 p-4 border border-slate-800">
            <p class="text-xs text-slate-400">信用評分</p>
            <p id="creditText" class="mt-2 text-2xl font-black text-blue-400">-- 分</p>
          </div>
          <div class="rounded-2xl bg-slate-800/50 p-4 border border-slate-800">
            <p class="text-xs text-slate-400">累計減碳量</p>
            <p id="carbonText" class="mt-2 text-2xl font-black text-cyan-400">-- kg</p>
          </div>
        </div>
      </section>

      <section class="mt-8 w-full text-center">
        <button id="rentBtn" class="w-full rounded-2xl bg-emerald-500 py-5 text-lg font-black text-slate-950 transition-all hover:bg-emerald-400 disabled:bg-slate-800 disabled:text-slate-600">
          <span id="rentBtnText">掃碼租借</span>
        </button>
        <p id="statusHint" class="mt-4 text-sm text-slate-400">等待商家生成 QR Code...</p>
        
        <button id="returnBtn" class="mt-4 w-full rounded-2xl border border-slate-700 py-3 text-sm font-bold text-slate-400 hover:bg-slate-800">
          模擬歸還 (測試按鈕)
        </button>
      </section>

      <section class="mt-10 w-full">
        <h2 class="text-lg font-bold mb-4 border-l-4 border-emerald-500 pl-3">交易紀錄與詳情</h2>
        <div id="transactionList" class="space-y-4">
          <p class="text-center text-slate-600 text-sm py-10">尚無交易紀錄</p>
        </div>
      </section>

      <footer class="mt-auto pt-8 text-center text-[10px] text-slate-600 uppercase tracking-widest">
        Circular System MVP • 2026 Northern Taiwan Hackathon
      </footer>
    </main>
  </div>

  <script>
    const API_BASE = window.location.origin;
    let previousTxCount = 0;
    let openDropdowns = new Set(); 

    window.toggleDetail = function(txId) {
      if (openDropdowns.has(txId)) {
        openDropdowns.delete(txId);
      } else {
        openDropdowns.add(txId);
      }
      const el = document.getElementById(`detail-${txId}`);
      if (el) el.classList.toggle("hidden");
    };

    function renderTransactions(transactions) {
      const list = document.getElementById("transactionList");
      if (transactions.length === 0) return;

      list.innerHTML = transactions.map(tx => {
        const isComp = tx.isCompleted;
        const statusColor = isComp ? "text-emerald-400 border-emerald-500/30 bg-emerald-500/10" : "text-orange-400 border-orange-500/30 bg-orange-500/10";
        const statusText = isComp ? "歸還完成" : "尚未歸還完成";
        const isHidden = openDropdowns.has(tx.id) ? "" : "hidden";

        return `
          <div class="rounded-2xl border border-slate-700 bg-slate-900/90 overflow-hidden shadow-lg">
            <button onclick="toggleDetail('${tx.id}')" class="w-full p-5 text-left flex justify-between items-start hover:bg-slate-800/50 transition">
              <div>
                <h3 class="font-bold text-base text-white">${tx.merchantName}</h3>
                <p class="text-[10px] text-slate-500 mt-1">${tx.date}</p>
                <div class="mt-3 flex gap-4">
                  <div>
                    <p class="text-[10px] text-slate-500 uppercase">交易金額</p>
                    <p class="text-sm font-bold text-emerald-400">$${tx.amount}</p>
                  </div>
                  <div>
                    <p class="text-[10px] text-slate-500 uppercase">應歸還日期</p>
                    <p class="text-sm font-bold text-slate-200">${tx.deadline}</p>
                  </div>
                </div>
              </div>
              <div class="flex flex-col items-end gap-2">
                <span class="px-2 py-1 rounded-md border text-[10px] font-bold ${statusColor}">${statusText}</span>
                <span class="text-slate-600 text-xs">詳情 ▼</span>
              </div>
            </button>

            <div id="detail-${tx.id}" class="${isHidden} bg-slate-950/50 border-t border-slate-800 p-5 space-y-4">
              ${tx.details.map(item => `
                <div class="flex items-center justify-between p-3 rounded-xl bg-slate-900 border border-slate-800">
                  <div class="space-y-1">
                    <div class="flex items-center gap-2">
                      <span class="text-xs font-bold text-white">${item.typeName}</span>
                      <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 font-mono">${item.id}</span>
                    </div>
                    <p class="text-[10px] text-slate-500">
                      ${item.isReturned ? `歸還日期: ${item.returnDate}` : `歸還期限: ${tx.deadline}`}
                    </p>
                  </div>
                  <span class="text-xs font-bold ${item.isReturned ? 'text-emerald-500' : 'text-orange-500'}">
                    ${item.isReturned ? '已歸還' : '使用中'}
                  </span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    async function fetchStatus() {
      try {
        const response = await fetch(`${API_BASE}/api/status`);
        const result = await response.json();
        if (result.success) {
          const d = result.data;
          document.getElementById("balanceText").textContent = `${d.balance} 元`;
          document.getElementById("pointsText").textContent = `${d.points} 點`;
          
          // 【更新】信用評分與累積減碳量
          document.getElementById("creditText").textContent = `${d.userCreditScore} 分`;
          document.getElementById("carbonText").textContent = `${d.userCarbonSaved.toFixed(2)} kg`;
          
          const rentBtn = document.getElementById("rentBtn");
          const statusHint = document.getElementById("statusHint");
          
          if (d.isPrepared) {
            rentBtn.disabled = false;
            rentBtn.classList.replace("bg-emerald-500", "bg-cyan-400");
            document.getElementById("rentBtnText").textContent = "確認領取容器";
            statusHint.textContent = "商家已準備好，請點擊確認租借";
          } else {
            rentBtn.disabled = true;
            rentBtn.classList.replace("bg-cyan-400", "bg-emerald-500");
            document.getElementById("rentBtnText").textContent = "掃碼租借";
            statusHint.textContent = "等待商家生成 QR Code...";
          }

          renderTransactions(d.transactions);
          
          if (previousTxCount > 0 && d.transactions.length > previousTxCount) {
             alert("租借成功！");
          }
          previousTxCount = d.transactions.length;
        }
      } catch (e) { console.error("同步失敗", e); }
    }

    document.getElementById("rentBtn").addEventListener("click", async () => {
      const res = await fetch(`${API_BASE}/api/rent`, { method: "POST" });
      const data = await res.json();
      if (!data.success) {
        alert(data.message); // 如果信用太低，這裡會跳出阻擋訊息
      } else {
        fetchStatus();
      }
    });

    document.getElementById("returnBtn").addEventListener("click", async () => {
      const res = await fetch(`${API_BASE}/api/return`, { method: "POST" });
      const data = await res.json();
      if (data.success) {
        alert(data.message); // 這裡會告訴用戶是否觸發了「冷卻期防弊」
        fetchStatus();
      } else {
        alert(data.message);
      }
    });

    setInterval(fetchStatus, 1500);
  </script>
</body>
</html>
