<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用戶端 - 環保容器循環系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <div class="relative min-h-screen px-4 py-8">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,_rgba(16,185,129,0.2),_transparent_45%)]"></div>

    <main class="relative mx-auto flex min-h-[90vh] w-full max-w-xl flex-col items-center">
      <section class="w-full rounded-2xl border border-slate-700 bg-slate-900/80 p-6 shadow-xl backdrop-blur">
        <h1 class="text-xl font-bold">我的帳戶</h1>
        <p class="mt-1 text-sm text-slate-400">環保容器循環系統 MVP</p>
        <div class="mt-5 grid grid-cols-2 gap-4">
          <div class="rounded-xl bg-slate-800/80 p-4">
            <p class="text-sm text-slate-400">錢包餘額</p>
            <p id="balanceText" class="mt-1 text-2xl font-bold text-emerald-400">載入中...</p>
          </div>
          <div class="rounded-xl bg-slate-800/80 p-4">
            <p class="text-sm text-slate-400">環保點數</p>
            <p id="pointsText" class="mt-1 text-2xl font-bold text-cyan-400">載入中...</p>
          </div>
        </div>
      </section>

      <section class="mt-8 flex w-full flex-1 flex-col items-center justify-center space-y-6">
        <div class="w-full text-center">
          <button
            id="rentBtn"
            class="group relative w-full overflow-hidden rounded-2xl bg-emerald-500 py-6 text-xl font-bold text-slate-950 transition-all hover:bg-emerald-400 disabled:opacity-50"
          >
            <span id="rentBtnText">掃碼租借</span>
          </button>
          <p id="statusHint" class="mt-4 text-sm text-slate-400 text-emerald-500/80">請掃描商家 QR Code 進行租借</p>
        </div>

        <div id="returnSection" class="hidden w-full text-center">
          <div class="mb-4 h-px w-full bg-slate-800"></div>
          <button
            id="returnBtn"
            class="w-full rounded-2xl border border-orange-500/50 bg-orange-500/10 py-4 text-lg font-bold text-orange-400 transition-all hover:bg-orange-500/20"
          >
            模擬歸還容器
          </button>
          <p class="mt-2 text-xs text-slate-500">Demo 專用：模擬容器投入歸還機之動作</p>
        </div>
      </section>

      <footer class="mt-auto pt-8 text-center text-xs text-slate-600">
        &copy; 2026 Northern Taiwan Hackathon - SDG 12 Project
      </footer>
    </main>
  </div>

  <script>
    const API_BASE = "http://localhost:3000"; // 自動適應連線位址
    const balanceText = document.getElementById("balanceText");
    const pointsText = document.getElementById("pointsText");
    const rentBtn = document.getElementById("rentBtn");
    const rentBtnText = document.getElementById("rentBtnText");
    const statusHint = document.getElementById("statusHint");
    const returnSection = document.getElementById("returnSection");
    const returnBtn = document.getElementById("returnBtn");

    let previousStatus = "idle";

    // 更新介面狀態
    function updateUI(status, isPrepared) {
      if (status === "rented") {
        // 租借中狀態
        rentBtn.disabled = true;
        rentBtnText.textContent = "容器使用中";
        statusHint.textContent = "請歸還後再進行下次租借";
        statusHint.className = "mt-4 text-sm text-orange-400";
        returnSection.classList.remove("hidden");
      } else {
        // 待租借狀態
        returnSection.classList.add("hidden");
        if (isPrepared) {
          rentBtn.disabled = false;
          rentBtnText.textContent = "確認租借";
          statusHint.textContent = "商家已準備就緒，點擊確認租借";
          statusHint.className = "mt-4 text-sm text-emerald-400 animate-pulse";
        } else {
          rentBtn.disabled = true;
          rentBtnText.textContent = "掃碼租借";
          statusHint.textContent = "等待商家生成租借 QR Code...";
          statusHint.className = "mt-4 text-sm text-slate-500";
        }
      }
    }

    // 向後端取得最新狀態
    async function fetchStatus() {
      try {
        const response = await fetch(`${API_BASE}/api/status`);
        const result = await response.json();

        if (result.success) {
          const d = result.data;
          // 對齊變數命名: status, balance, points, isPrepared
          balanceText.textContent = `${d.balance} 元`;
          pointsText.textContent = `${d.points} 點`;
          
          updateUI(d.status, d.isPrepared);

          // 偵測歸還成功瞬間 (提供視覺回饋)
          if (previousStatus === "rented" && d.status === "idle") {
            alert("歸還成功！押金 50 元已退回帳戶。");
          }
          previousStatus = d.status;
        }
      } catch (error) {
        console.error("讀取失敗", error);
        balanceText.textContent = "ERR";
        pointsText.textContent = "ERR";
      }
    }

    // 點擊租借
    rentBtn.addEventListener("click", async () => {
      try {
        const response = await fetch(`${API_BASE}/api/rent`, { method: "POST" });
        const res = await response.json();
        if (res.success) {
          alert("租借成功！");
          fetchStatus();
        } else {
          alert(res.message);
        }
      } catch (e) {
        alert("租借請求失敗");
      }
    });

    // 點擊歸還 (取代原本的 ESP32 硬體行為)
    returnBtn.addEventListener("click", async () => {
      try {
        const response = await fetch(`${API_BASE}/api/return`, { method: "POST" });
        const res = await response.json();
        if (res.success) {
          fetchStatus();
        }
      } catch (e) {
        alert("歸還請求失敗");
      }
    });

    // 輪詢狀態 (每 1.5 秒更新一次)
    setInterval(fetchStatus, 1500);
    fetchStatus();
  </script>
</body>
</html>
