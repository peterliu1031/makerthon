<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商家端 - 環保容器循環系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <div class="relative flex min-h-screen items-center justify-center px-4">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,_rgba(56,189,248,0.18),_transparent_50%)]"></div>

    <main class="relative w-full max-w-lg rounded-2xl border border-slate-700 bg-slate-900/80 p-8 shadow-2xl backdrop-blur">
      <h1 class="text-center text-2xl font-bold tracking-wide">商家端控制台</h1>
      <p class="mt-2 text-center text-sm text-slate-400">環保容器循環系統 MVP</p>

      <button
        id="generateBtn"
        type="button"
        class="mt-8 w-full rounded-xl bg-cyan-500 px-6 py-5 text-lg font-semibold text-slate-950 transition hover:bg-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-300"
      >
        生成租借 QR Code
      </button>

      <section id="qrSection" class="mt-8 hidden text-center">
        <img
          id="qrImage"
          src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=rent_trigger"
          alt="租借 QR Code"
          class="mx-auto rounded-lg border border-slate-700 bg-white p-2 shadow-lg"
        />
        <p class="mt-4 text-base font-medium text-emerald-300">請讓客戶掃描</p>
      </section>
    </main>
  </div>

  <script>
    const generateBtn = document.getElementById("generateBtn");
    const qrSection = document.getElementById("qrSection");

    generateBtn.addEventListener("click", async () => {
  try {
    const response = await fetch("http://localhost:3000/api/prepare", { method: "POST" });
    const result = await response.json();
    
    if (result.success) {
      qrSection.classList.remove("hidden");
      generateBtn.textContent = "租借功能已激活";
      generateBtn.disabled = true;
      generateBtn.classList.add("opacity-70", "cursor-not-allowed");
    }
  } catch (err) {
    alert("連線伺服器失敗");
  }
});
  </script>
</body>
</html>
