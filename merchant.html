<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>商家端 - 循環工作台</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;600;700&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Nunito", "sans-serif"],
              serif: ["Fraunces", "serif"],
            },
            colors: {
              foreground: "#2C2C24",
              primary: "#5D7052",
              "primary-foreground": "#F3F4F1",
              secondary: "#C18C5D",
              muted: "#F0EBE5",
              "muted-foreground": "#78786C",
              border: "#DED8CF",
            },
            boxShadow: { soft: "0 4px 20px -2px rgba(93, 112, 82, 0.15)" },
          },
        },
      };
    </script>
    <style>
      /* 紙張雜訊 */
      .noise-overlay::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        opacity: 0.04;
        pointer-events: none;
        mix-blend-mode: multiply;
        background-image: url("data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.8%22 numOctaves=%223%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22/%3E%3C/svg%3E");
      }
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
    </style>
  </head>
  <body
    class="min-h-screen bg-[radial-gradient(circle_at_center,_#F9FBF5_0%,_#E1EED3_50%,_#C2DBAA_100%)] text-foreground p-4 sm:p-6 lg:p-8 font-sans relative noise-overlay"
  >
    <div
      class="fixed top-[-10%] right-[-10%] w-[60%] h-[60%] bg-primary/5 blur-[120px] rounded-[50%] pointer-events-none z-0"
    ></div>

    <div
      class="relative z-10 mx-auto max-w-5xl grid grid-cols-1 lg:grid-cols-3 gap-6 lg:gap-10"
    >
      <section class="lg:col-span-2 space-y-6">
        <div
          class="bg-[#FEFEFA] border border-border/80 p-6 sm:p-10 shadow-soft rounded-[2.5rem] rounded-br-[4rem]"
        >
          <div
            class="flex items-center gap-4 mb-3 pb-4 border-b border-border/50"
          >
            <div
              class="h-12 w-12 rounded-[40%_60%_70%_30%/40%_50%_60%_50%] bg-primary/10 flex items-center justify-center flex-shrink-0"
            >
              <i data-lucide="package-plus" class="w-6 h-6 text-primary"></i>
            </div>
            <div>
              <h1
                class="text-2xl sm:text-3xl font-serif font-bold text-foreground"
              >
                容器發行控制
              </h1>
              <p class="text-sm text-muted-foreground mt-1 tracking-wider">
                設定要借出的品項與數量
              </p>
            </div>
          </div>

          <div class="mt-10 space-y-4">
            <div
              class="flex items-center justify-between p-5 sm:p-6 rounded-[1.5rem] bg-white border border-border/50 hover:border-primary/40 transition-colors duration-300 group shadow-sm"
            >
              <div class="min-w-0 flex items-center gap-4">
                <div
                  class="p-3 bg-muted/50 rounded-full flex-shrink-0 group-hover:bg-primary/10 transition-colors"
                >
                  <i
                    data-lucide="coffee"
                    class="w-5 h-5 text-muted-foreground group-hover:text-primary"
                  ></i>
                </div>
                <div class="min-w-0">
                  <p
                    class="font-bold text-lg text-foreground font-serif truncate"
                  >
                    環保杯
                  </p>
                  <p
                    class="text-[10px] text-muted-foreground font-mono mt-0.5 tracking-tight"
                  >
                    ID: 001
                  </p>
                </div>
              </div>
              <div
                class="flex items-center gap-2 sm:gap-4 bg-muted/30 p-1.5 rounded-full border border-border/40 ml-3 flex-shrink-0"
              >
                <button
                  onclick="changeQty('CUP', -1)"
                  class="w-10 h-10 rounded-full bg-white border border-border hover:bg-muted text-foreground transition-all duration-200 flex items-center justify-center shadow-sm active:scale-95"
                >
                  <i data-lucide="minus" class="w-4 h-4"></i>
                </button>
                <input
                  type="number"
                  id="qty-CUP"
                  value="0"
                  min="0"
                  onchange="validateInput('CUP')"
                  class="w-10 bg-transparent text-center text-xl font-bold font-serif outline-none text-foreground tracking-tight"
                />
                <button
                  onclick="changeQty('CUP', 1)"
                  class="w-10 h-10 rounded-full bg-white border border-border hover:bg-muted text-foreground transition-all duration-200 flex items-center justify-center shadow-sm active:scale-95"
                >
                  <i data-lucide="plus" class="w-4 h-4"></i>
                </button>
              </div>
              <div class="text-right w-24 hidden sm:block ml-4 flex-shrink-0">
                <p class="text-[10px] text-muted-foreground">
                  庫存:
                  <span id="stock-CUP" class="font-bold text-foreground"
                    >0</span
                  >
                </p>
                <p class="text-xs mt-1 font-semibold">
                  剩餘:
                  <span id="remain-CUP" class="text-primary font-bold">0</span>
                </p>
              </div>
            </div>

            <div
              class="flex items-center justify-between p-5 sm:p-6 rounded-[1.5rem] bg-white border border-border/50 hover:border-secondary/40 transition-colors duration-300 group shadow-sm"
            >
              <div class="min-w-0 flex items-center gap-4">
                <div
                  class="p-3 bg-muted/50 rounded-full flex-shrink-0 group-hover:bg-secondary/10 transition-colors"
                >
                  <i
                    data-lucide="box"
                    class="w-5 h-5 text-muted-foreground group-hover:text-secondary"
                  ></i>
                </div>
                <div class="min-w-0">
                  <p
                    class="font-bold text-lg text-foreground font-serif truncate"
                  >
                    餐盒
                  </p>
                  <p
                    class="text-[10px] text-muted-foreground font-mono mt-0.5 tracking-tight"
                  >
                    ID: 002
                  </p>
                </div>
              </div>
              <div
                class="flex items-center gap-2 sm:gap-4 bg-muted/30 p-1.5 rounded-full border border-border/40 ml-3 flex-shrink-0"
              >
                <button
                  onclick="changeQty('BOX', -1)"
                  class="w-10 h-10 rounded-full bg-white border border-border hover:bg-muted text-foreground transition-all duration-200 flex items-center justify-center shadow-sm active:scale-95"
                >
                  <i data-lucide="minus" class="w-4 h-4"></i>
                </button>
                <input
                  type="number"
                  id="qty-BOX"
                  value="0"
                  min="0"
                  onchange="validateInput('BOX')"
                  class="w-10 bg-transparent text-center text-xl font-bold font-serif outline-none text-foreground tracking-tight"
                />
                <button
                  onclick="changeQty('BOX', 1)"
                  class="w-10 h-10 rounded-full bg-white border border-border hover:bg-muted text-foreground transition-all duration-200 flex items-center justify-center shadow-sm active:scale-95"
                >
                  <i data-lucide="plus" class="w-4 h-4"></i>
                </button>
              </div>
              <div class="text-right w-24 hidden sm:block ml-4 flex-shrink-0">
                <p class="text-[10px] text-muted-foreground">
                  庫存:
                  <span id="stock-BOX" class="font-bold text-foreground"
                    >0</span
                  >
                </p>
                <p class="text-xs mt-1 font-semibold">
                  剩餘:
                  <span id="remain-BOX" class="text-secondary font-bold"
                    >0</span
                  >
                </p>
              </div>
            </div>

            <div
              class="flex items-center justify-between p-5 sm:p-6 rounded-[1.5rem] bg-white border border-border/50 hover:border-primary/40 transition-colors duration-300 group shadow-sm"
            >
              <div class="min-w-0 flex items-center gap-4">
                <div
                  class="p-3 bg-muted/50 rounded-full flex-shrink-0 group-hover:bg-primary/10 transition-colors"
                >
                  <i
                    data-lucide="soup"
                    class="w-5 h-5 text-muted-foreground group-hover:text-primary"
                  ></i>
                </div>
                <div class="min-w-0">
                  <p
                    class="font-bold text-lg text-foreground font-serif truncate"
                  >
                    湯碗
                  </p>
                  <p
                    class="text-[10px] text-muted-foreground font-mono mt-0.5 tracking-tight"
                  >
                    ID: 003
                  </p>
                </div>
              </div>
              <div
                class="flex items-center gap-2 sm:gap-4 bg-muted/30 p-1.5 rounded-full border border-border/40 ml-3 flex-shrink-0"
              >
                <button
                  onclick="changeQty('BOWL', -1)"
                  class="w-10 h-10 rounded-full bg-white border border-border hover:bg-muted text-foreground transition-all duration-200 flex items-center justify-center shadow-sm active:scale-95"
                >
                  <i data-lucide="minus" class="w-4 h-4"></i>
                </button>
                <input
                  type="number"
                  id="qty-BOWL"
                  value="0"
                  min="0"
                  onchange="validateInput('BOWL')"
                  class="w-10 bg-transparent text-center text-xl font-bold font-serif outline-none text-foreground tracking-tight"
                />
                <button
                  onclick="changeQty('BOWL', 1)"
                  class="w-10 h-10 rounded-full bg-white border border-border hover:bg-muted text-foreground transition-all duration-200 flex items-center justify-center shadow-sm active:scale-95"
                >
                  <i data-lucide="plus" class="w-4 h-4"></i>
                </button>
              </div>
              <div class="text-right w-24 hidden sm:block ml-4 flex-shrink-0">
                <p class="text-[10px] text-muted-foreground">
                  庫存:
                  <span id="stock-BOWL" class="font-bold text-foreground"
                    >0</span
                  >
                </p>
                <p class="text-xs mt-1 font-semibold">
                  剩餘:
                  <span id="remain-BOWL" class="text-primary font-bold">0</span>
                </p>
              </div>
            </div>
          </div>

          <button
            id="generateBtn"
            class="mt-10 w-full rounded-full bg-primary py-5 text-base sm:text-lg font-bold text-primary-foreground hover:scale-[1.02] active:scale-95 transition-all duration-300 disabled:bg-muted disabled:text-muted-foreground disabled:hover:scale-100 shadow-soft flex items-center justify-center gap-2.5"
          >
            <i data-lucide="qr-code" class="w-5 h-5"></i> 發行 QR Code
          </button>

          <div
            id="qrSection"
            class="mt-8 hidden border-t border-border/50 pt-8 text-center relative z-10"
          >
            <div
              class="inline-block bg-white p-4 rounded-2xl shadow-float border border-border/50"
            >
              <img id="qrImage" src="" alt="QRCode" />
            </div>
            <p
              id="qrStatus"
              class="mt-5 text-primary font-medium animate-pulse flex items-center justify-center gap-2"
            >
              <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
              等待客人感應...
            </p>
          </div>
        </div>
      </section>

      <aside class="space-y-6">
        <div
          class="bg-[#FEFEFA] border border-border/80 p-6 sm:p-8 shadow-soft rounded-[2.5rem] rounded-tl-[4rem] h-full relative overflow-hidden"
        >
          <h2
            class="text-lg font-serif font-bold pb-4 flex items-center gap-2 text-primary border-b border-border/50 relative z-10"
          >
            <i data-lucide="leaf" class="w-5 h-5"></i> 推廣成果看板
          </h2>
          <div class="mt-6 grid grid-cols-2 gap-4 mb-10 relative z-10">
            <div
              class="bg-white p-4 rounded-2xl border border-border/60 text-center hover:border-primary/30 transition-colors shadow-sm group"
            >
              <p
                class="text-[10px] text-muted-foreground font-medium tracking-wider"
              >
                成功借出容器
              </p>
              <p
                class="text-2xl font-serif font-bold text-foreground mt-1.5"
                id="merchantEco"
              >
                0
                <span
                  class="text-xs font-sans font-normal text-muted-foreground"
                  >個</span
                >
              </p>
            </div>
            <div
              class="bg-white p-4 rounded-2xl border border-border/60 text-center hover:border-secondary/30 transition-colors shadow-sm group"
            >
              <p
                class="text-[10px] text-muted-foreground font-medium tracking-wider"
              >
                累積減少碳排
              </p>
              <p
                class="text-2xl font-serif font-bold text-secondary mt-1.5"
                id="merchantCarbon"
              >
                0
                <span
                  class="text-xs font-sans font-normal text-muted-foreground"
                  >kg</span
                >
              </p>
            </div>
          </div>

          <h2
            class="text-sm font-bold pb-3 flex items-center gap-2 text-foreground border-b border-border/50 tracking-wider relative z-10"
          >
            <i data-lucide="clock-3" class="w-4 h-4 text-muted-foreground"></i>
            即時租借動態
          </h2>
          <div
            id="adminHistory"
            class="mt-6 space-y-4 max-h-[400px] overflow-y-auto no-scrollbar pr-1 relative z-10"
          ></div>
        </div>
      </aside>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (typeof lucide !== "undefined") lucide.createIcons();
        syncAdmin();
      });

      const API_BASE = window.location.origin;
      let currentStock = { CUP: 0, BOX: 0, BOWL: 0 };

      function updateStockUI() {
        ["CUP", "BOX", "BOWL"].forEach((type) => {
          const selected =
            parseInt(document.getElementById(`qty-${type}`).value) || 0;
          const remain = currentStock[type] - selected;
          document.getElementById(`stock-${type}`).textContent =
            currentStock[type];
          const rEl = document.getElementById(`remain-${type}`);
          rEl.textContent = remain;
          rEl.className =
            remain < 0
              ? "text-destructive font-bold"
              : "text-primary font-bold";
        });
      }

      function changeQty(t, d) {
        const i = document.getElementById(`qty-${t}`);
        let v = parseInt(i.value) + d;
        if (v < 0) v = 0;
        if (v > currentStock[t]) v = currentStock[t];
        i.value = v;
        updateStockUI();
      }
      function validateInput(t) {
        const i = document.getElementById(`qty-${t}`);
        let v = parseInt(i.value) || 0;
        if (v < 0) v = 0;
        if (v > currentStock[t]) v = currentStock[t];
        i.value = v;
        updateStockUI();
      }

      document
        .getElementById("generateBtn")
        .addEventListener("click", async () => {
          const p = {
            CUP: parseInt(document.getElementById("qty-CUP").value),
            BOX: parseInt(document.getElementById("qty-BOX").value),
            BOWL: parseInt(document.getElementById("qty-BOWL").value),
          };
          if (Object.values(p).every((v) => v === 0))
            return alert("請選擇數量");
          const res = await fetch(`${API_BASE}/api/prepare`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(p),
          });
          const d = await res.json();
          if (d.success) {
            document.getElementById("qrImage").src =
              `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=RENT_ORDER`;
            document.getElementById("qrSection").classList.remove("hidden");
            document.getElementById("generateBtn").disabled = true;
          } else alert(d.message);
        });

      async function syncAdmin() {
        try {
          const response = await fetch(`${API_BASE}/api/status`);
          const result = await response.json();
          if (result.success) {
            const {
              transactions,
              isPrepared,
              inventory,
              merchantEcoContribution,
              merchantCarbonSaved,
            } = result.data;

            document.getElementById("merchantEco").innerHTML =
              `${merchantEcoContribution} <span class="text-xs font-sans font-normal text-muted-foreground">個</span>`;
            document.getElementById("merchantCarbon").innerHTML =
              `${merchantCarbonSaved.toFixed(2)} <span class="text-xs font-sans font-normal text-muted-foreground">kg</span>`;

            currentStock.CUP = inventory.filter(
              (i) => i.typeKey === "CUP" && i.status === "idle",
            ).length;
            currentStock.BOX = inventory.filter(
              (i) => i.typeKey === "BOX" && i.status === "idle",
            ).length;
            currentStock.BOWL = inventory.filter(
              (i) => i.typeKey === "BOWL" && i.status === "idle",
            ).length;
            updateStockUI();

            if (
              !isPrepared &&
              !document.getElementById("qrSection").classList.contains("hidden")
            ) {
              document.getElementById("qrStatus").innerHTML =
                `<i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-500"></i> 客人已成功感應`;
              document
                .getElementById("qrStatus")
                .classList.remove("animate-pulse");
              lucide.createIcons();

              setTimeout(() => {
                document.getElementById("qrSection").classList.add("hidden");
                document.getElementById("generateBtn").disabled = false;
                document.getElementById("qrStatus").innerHTML =
                  `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> 等待客人感應...`;
                document
                  .getElementById("qrStatus")
                  .classList.add("animate-pulse");
                document
                  .querySelectorAll('input[type="number"]')
                  .forEach((i) => (i.value = 0));
                updateStockUI();
                lucide.createIcons();
              }, 3000);
            }

            const historyDiv = document.getElementById("adminHistory");
            if (transactions.length > 0) {
              historyDiv.innerHTML = transactions
                .map(
                  (tx) => `
              <div class="bg-white border border-border/60 rounded-[1.2rem] p-4.5 shadow-sm hover:shadow-soft hover:border-border transition-all">
                <div class="flex justify-between font-serif font-bold text-foreground">
                  <span>${tx.renterName} 租借成功</span>
                  <span class="text-primary tracking-tight">$${tx.amount}</span>
                </div>
                <div class="mt-2.5 space-y-1.5 bg-muted/20 p-3 rounded-lg text-xs font-medium text-muted-foreground">
                  ${tx.details
                    .map(
                      (item) => `
                    <div class="flex justify-between items-center gap-2">
                      <span class="truncate">${item.typeName}</span> 
                      <span class="font-mono text-[9px] bg-white px-1.5 py-0.5 rounded border border-border/50 text-slate-500 tracking-tight flex-shrink-0">${item.id}</span>
                    </div>
                  `,
                    )
                    .join("")}
                </div>
                <p class="mt-3.5 text-[9px] text-muted-foreground/70 font-sans tracking-wide">${tx.date}</p>
              </div>
            `,
                )
                .join("");
            }
          }
        } catch (e) {
          console.error(e);
        }
      }
      setInterval(syncAdmin, 1500);
    </script>
  </body>
</html>
